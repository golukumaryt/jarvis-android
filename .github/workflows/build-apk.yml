name: Build Jarvis APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip openjdk-17-jdk unzip zip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer "cython==0.29.36"
      - name: Set up Android SDK (first pass)
        run: buildozer android debug || true
      - name: Pre-accept Android SDK licenses
        run: |
          SDK=$HOME/.buildozer/android/platform/android-sdk
          echo "=== Android SDK layout ==="
          ls -la "$SDK" || echo "SDK directory missing: $SDK"
          find "$SDK" -maxdepth 4 -print 2>/dev/null | head -100
          mkdir -p "$SDK/licenses"
          printf '8933bad161af4178b1185d1a37fbf41ea5269c55\n' > "$SDK/licenses/android-sdk-license"
          printf '84831b9409646a918e30573bab4c9c66d\n' > "$SDK/licenses/android-sdk-preview-license"
          printf 'd975f751698a77b662f1254d1e76e76ce1c9a5b6\n' > "$SDK/licenses/intel-android-extra-license"
          echo "=== Licenses written ==="
          ls -la "$SDK/licenses"
          SDKM=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SDKM" ]; then
            echo "sdkmanager at: $SDKM"
            yes | "$SDKM" --sdk_root="$SDK" --licenses || true
          else
            echo "sdkmanager not found under $SDK - relying on pre-accepted license files"
          fi
      - name: Build APK
        run: buildozer android debug
      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0-${{ github.run_number }}
          name: Jarvis Android v2.0
          files: bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
