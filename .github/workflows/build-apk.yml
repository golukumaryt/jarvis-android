name: Build Jarvis APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip openjdk-17-jdk unzip zip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libsqlite3-dev libbz2-dev libltdl-dev
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer "cython==0.29.36"
      - name: Set up Android SDK (first pass)
        run: buildozer android debug || true
      - name: Accept Android SDK licenses
        run: |
          SDK=$HOME/.buildozer/android/platform/android-sdk
          SDKM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "sdkmanager at: $SDKM"
          yes | "$SDKM" --licenses
      - name: Build APK
        run: buildozer android debug
      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1-${{ github.run_number }}
          name: Jarvis Android v1.1
          files: bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
